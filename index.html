<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendář zájezdů 2027</title>
<style>
  :root {
    --line:#d9dee7;
    --muted:#6b7280;
    --bg:#f4f6f9;
    --paper:#fff;
    --daynum-h:22px;
    --lane-h:15px;
    --lane-gap:2px;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family:Arial,"Segoe UI",sans-serif;
    background:var(--bg);
    color:#172033;
  }
  .toolbar {
    position:sticky; top:0; z-index:50;
    display:flex; gap:8px; align-items:center; justify-content:center;
    padding:10px;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  button, select {
    border:1px solid #cbd2dc;
    background:white;
    border-radius:8px;
    padding:8px 11px;
    font-size:14px;
    cursor:pointer;
  }
  button.primary {
    background:#172033;
    color:white;
    border-color:#172033;
  }
  .wrap {
    max-width:1500px;
    margin:18px auto 50px;
    padding:0 16px;
  }
  .month {
    background:var(--paper);
    border:1px solid #e0e4ea;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(21,31,48,.08);
    padding:14px;
    margin-bottom:18px;
    page-break-after:always;
    break-after:page;
  }
  .month.hidden-screen { display:none; }
  .month-title {
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    margin:0 2px 10px;
  }
  .month-title h1 {
    margin:0;
    font-size:25px;
    letter-spacing:.2px;
  }
  .month-title .meta {
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  .weekday-row {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:9px 9px 0 0;
    overflow:hidden;
  }
  .weekday {
    padding:5px 6px;
    text-align:center;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    background:#edf1f6;
    border-right:1px solid var(--line);
  }
  .weekday:last-child { border-right:0; }
  .week {
    position:relative;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-top:1px solid var(--line);
    min-height:42px;
  }
  .week:last-of-type {
    border-bottom:1px solid var(--line);
    border-radius:0 0 9px 9px;
    overflow:hidden;
  }
  .day {
    position:relative;
    min-width:0;
    border-right:1px solid var(--line);
    background:#fff;
  }
  .day:last-child { border-right:0; }
  .day.out { background:#f7f8fa; }
  .day.weekend { background:#fbfbfd; }
  .day.out .daynum { color:#b4bac4; }
  .daynum {
    position:absolute;
    top:3px;
    left:5px;
    z-index:3;
    font-weight:700;
    font-size:10px;
    color:#4a5568;
  }
  .events {
    position:absolute;
    inset:var(--daynum-h) 0 3px 0;
    pointer-events:none;
    z-index:5;
  }
  .event {
    position:absolute;
    height:var(--lane-h);
    line-height:var(--lane-h);
    border-radius:4px;
    padding:0 4px;
    font-size:8.2px;
    font-weight:700;
    color:#18202f;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border:1px solid rgba(0,0,0,.12);
    box-shadow:0 1px 1px rgba(0,0,0,.05);
    pointer-events:auto;
  }
  .event.cont-left {
    border-top-left-radius:0;
    border-bottom-left-radius:0;
  }
  .event.cont-right {
    border-top-right-radius:0;
    border-bottom-right-radius:0;
  }
  .legend {
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:4px 10px;
    margin-top:9px;
  }
  .legend-item {
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    font-size:9px;
    line-height:1.2;
  }
  .swatch {
    width:12px;
    height:9px;
    border-radius:3px;
    border:1px solid rgba(0,0,0,.12);
    flex:0 0 auto;
  }
  .legend-text {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .note {
    margin:7px 2px 0;
    color:#7a8290;
    font-size:9px;
  }
  @media (max-width:900px) {
    .legend { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .event { font-size:7px; }
  }
  @page {
    size:A4 landscape;
    margin:7mm;
  }
  @media print {
    :root {
      --daynum-h:17px;
      --lane-h:12.2px;
      --lane-gap:1.2px;
    }
    body { background:white; }
    .toolbar { display:none !important; }
    .wrap { max-width:none; margin:0; padding:0; }
    .month, .month.hidden-screen {
      display:block !important;
      box-shadow:none;
      border:0;
      border-radius:0;
      margin:0;
      padding:0;
      height:190mm;
      overflow:hidden;
      page-break-after:always;
      break-after:page;
    }
    .month:last-child { page-break-after:auto; break-after:auto; }
    .month-title { margin:0 0 5px; }
    .month-title h1 { font-size:18px; }
    .month-title .meta { font-size:8px; }
    .weekday { font-size:8px; padding:3px; }
    .daynum { font-size:7.5px; top:2px; left:4px; }
    .event {
      font-size:6.3px;
      padding:0 2.5px;
      border-radius:2px;
      box-shadow:none;
    }
    .legend {
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:2px 7px;
      margin-top:5px;
    }
    .legend-item { font-size:6.8px; gap:3px; }
    .swatch { width:8px; height:6px; }
    .note { display:none; }
  }

  .instructions-event {
    background:#fff3bf !important;
    border:1px dashed #d69e2e !important;
    color:#7a4b00 !important;
  }
  .work-list {
    margin-top:18px;
    border-top:2px solid #e0e4ea;
    padding-top:14px;
  }
  .work-list h2 {
    margin:0 0 10px;
    font-size:18px;
  }
  .trip-row {
    display:grid;
    grid-template-columns:minmax(260px,1fr) auto;
    gap:10px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid #e6e9ee;
  }
  .trip-info {
    min-width:0;
    font-size:12px;
  }
  .trip-info strong { display:block; font-size:13px; }
  .trip-date { color:var(--muted); margin-top:2px; }
  .trip-actions {
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    justify-content:flex-end;
  }
  .status-btn {
    padding:5px 8px;
    border-radius:6px;
    font-size:11px;
    background:#fff;
  }
  .status-btn.done {
    background:#2e9d55;
    border-color:#237b42;
    color:#fff;
  }
  .remove-btn {
    padding:5px 8px;
    border-radius:6px;
    font-size:11px;
    color:#a32121;
    border-color:#e0aaaa;
    background:#fff7f7;
  }
  @media (max-width:900px) {
    .trip-row { grid-template-columns:1fr; }
    .trip-actions { justify-content:flex-start; }
  }
  @media print {
    .work-list { display:none !important; }
  }


  .instructions-event{background:#fff3bf !important;border:1px dashed #d69e2e !important;color:#7a4b00 !important}
  .reservation-event{background:#dbeafe !important;border:1px dashed #3b82f6 !important;color:#173f73 !important}
  body.hide-instructions .instructions-event{display:none !important}
  .work-list{margin-top:18px;border-top:2px solid #e0e4ea;padding-top:14px}.work-list h2{margin:0 0 10px;font-size:18px}
  .trip-row{display:grid;grid-template-columns:minmax(260px,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #e6e9ee}
  .trip-info{min-width:0;font-size:12px}.trip-info strong{display:block;font-size:13px}.trip-date{color:var(--muted);margin-top:2px}
  .trip-actions{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.status-btn,.remove-btn{padding:5px 8px;border-radius:6px;font-size:11px}
  .status-btn.done{background:#2e9d55;border-color:#237b42;color:#fff}.remove-btn{color:#a32121;border-color:#e0aaaa;background:#fff7f7}
  @media(max-width:900px){.trip-row{grid-template-columns:1fr}.trip-actions{justify-content:flex-start}}
  @media print{.work-list{display:none !important}}

</style>
</head>

function renderAll(pm=null){const old=pm!==null?pm:(monthsWithTrips[currentIndex]??null);monthsWithTrips=calcMonths();app.innerHTML="";select.innerHTML="";monthsWithTrips.forEach(m=>{app.appendChild(createMonth(m));const o=document.createElement("option");o.value=m;o.textContent=`${monthNamesTitle[m]} ${YEAR}`;select.appendChild(o)});currentIndex=old!==null&&monthsWithTrips.includes(old)?monthsWithTrips.indexOf(old):0;showMonth()}
function showMonth(){document.querySelectorAll(".month").forEach((e,i)=>e.classList.toggle("hidden-screen",i!==currentIndex));if(monthsWithTrips.length)select.value=monthsWithTrips[currentIndex]}
document.getElementById("prev").onclick=()=>{currentIndex=(currentIndex-1+monthsWithTrips.length)%monthsWithTrips.length;showMonth()};document.getElementById("next").onclick=()=>{currentIndex=(currentIndex+1)%monthsWithTrips.length;showMonth()};select.onchange=()=>{currentIndex=monthsWithTrips.indexOf(Number(select.value));showMonth()};
const toggle=document.getElementById("toggleInstructions");toggle.onclick=()=>{const h=document.body.classList.toggle("hide-instructions");toggle.textContent=h?"Zobrazit pokyny":"Skrýt pokyny"};
renderAll();

</script>
</body>
</html>
